<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OriginX Studio | Creative Design Studio</title>

    <!-- SEO -->
    <meta name="description" content="OriginX Studio - We craft brands, websites, and digital experiences that stand out and perform.">
    <meta name="keywords" content="design studio, branding, web design, UI UX design, originx studio, creative agency">
    <meta name="author" content="OriginX Studio">
    <meta name="robots" content="index, follow">

    <!-- Open Graph -->
    <meta property="og:title" content="OriginX Studio | Creative Design Studio">
    <meta property="og:description" content="We craft brands, websites, and digital experiences that stand out.">
    <meta property="og:url" content="https://originxstudio.in">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="OriginX Studio">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="OriginX Studio">
    <meta name="twitter:description" content="Creative Design Studio">

    <!-- Canonical URL -->
    <link rel="canonical" href="https://originxstudio.in">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Arial', sans-serif;
        }

        /* Loading Screen */
        .loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.6s ease, visibility 0.6s ease;
        }

        .loader.hidden {
            opacity: 0;
            visibility: hidden;
        }

        .loader-logo {
            color: #fff;
            font-size: 32px;
            font-weight: 700;
            letter-spacing: 10px;
            text-transform: uppercase;
            margin-bottom: 30px;
        }

        .loader-logo span {
            color: #6C63FF;
        }

        /* Loading Bar */
        .loading-bar-container {
            width: 200px;
            height: 2px;
            background: #222;
            border-radius: 10px;
            overflow: hidden;
        }

        .loading-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #6C63FF, #00D9FF);
            border-radius: 10px;
            animation: loading 2s ease-in-out forwards;
        }

        @keyframes loading {
            0% { width: 0%; }
            50% { width: 70%; }
            100% { width: 100%; }
        }

        /* Site Frame */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            position: absolute;
            top: 0;
            left: 0;
        }
    </style>
</head>
<body>

    <!-- Loading Screen -->
    <div class="loader" id="loader">
        <div class="loader-logo">Origin<span>X</span></div>
        <div class="loading-bar-container">
            <div class="loading-bar"></div>
        </div>
    </div>

    <!-- Framer Site -->
    <iframe
        src="https://originxstudio.framer.website/"
        allowfullscreen
        loading="eager"
        id="site-frame"
        onload="hideLoader()"
    ></iframe>

    <script>
        function hideLoader() {
            setTimeout(() => {
                document.getElementById('loader').classList.add('hidden');
            }, 1500);
        }

        // Fallback loader hide
        setTimeout(() => {
            document.getElementById('loader').classList.add('hidden');
        }, 5000);
    </script>

</body>
</html>
